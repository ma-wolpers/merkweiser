name: merkweiser_notify
description: Merkweiser – geplante Android-Benachrichtigungen (Flet-Erweiterung, Spike S5)
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flet: ^0.86.5
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: de.merkweiser.notify
        pluginClass: MerkweiserNotifyPlugin
